# 慢层：每天跑一次全量确认，不进每次提交的门禁。
#
# 分层理由：快层（`python3 scripts/check-queue.py` 与 `ci.yml`）用 `-short` 跳过重活，
# 目标 2 分钟内出结论；慢层没有时间预算，把被跳过的重活、harness 行为门禁与全量测试
# 重新跑一遍，任何一处红都说明快层的跳过掩盖了回归。
#
# 三层内容：
#   1. `full`：两个 module 的 `-count=1` 全量测试（不用缓存结果，也不加 -short）；
#   2. `gate`：`go -C backend run ./cmd/graphcheck all`（快层同一批步骤再走一遍）；
#   3. `harness`：`graphcheck harness` 单独跑，失败时把判决与日志一起留下。
#
# 每项都上传日志（不只是失败时）：慢层的结果要能事后回看趋势。
#
# 第四层 `ui`：真的把界面驱动一遍。这一层在 2026-11-26 之前不存在，于是
# `verification/skills/verify-graph` 的 30 多条 journey 没有任何人或机器在跑，
# `index.json` 的 verifiedAt 停在 11-17，而之后两周的界面改动都没有断言判死——
# 一个已经删掉的页面（洞察页）能同时活在 scenario、ledger 和 Feature Map 里。
#
# 它只跑被点名的 journey，不跑 `--all`：F-15-tray 与 controls-tray 需要 macOS
# 辅助功能权限，评价里天生是环境红；把它们放进 nightly 只会让这层长期变红，
# 真回归就淹在里面。待这三条场景修好后，再把它们加进名单。

name: nightly

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'

jobs:
  full:
    name: full test (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module: [backend, app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            backend/go.sum
            app/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 全量测试（不跳过任何用例）
        run: go -C ${{ matrix.module }} test -count=1 ./...
      - name: 保留日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-full-${{ matrix.module }}
          path: |
            backend/**/*.log
            app/**/*.log
          if-no-files-found: ignore

  gate:
    name: 全量确认（graphcheck all）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            backend/go.sum
            app/go.sum
      - name: graphcheck all
        run: go -C backend run ./cmd/graphcheck all
      - name: 保留日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-gate
          path: |
            backend/**/*.log
            app/**/*.log
          if-no-files-found: ignore

  harness:
    name: harness 行为门禁
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            backend/go.sum
            app/go.sum
      - name: graphcheck harness
        run: go -C backend run ./cmd/graphcheck harness
      - name: 保留判决
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-harness
          path: |
            backend/internal/harness/testdata/**
            state/**/*.log
          if-no-files-found: ignore

  # 界面门禁：真的把 journey 跑一遍。选中的是当前实绿的 26 条；
  # F-15-tray、controls-tray 需要辅助功能权限（环境红），
  # controls-context-tabs、controls-fleet、controls-model-picker 的断言面已过期（见 store 里的 friction）。
  ui:
    name: 界面 journey（verify-graph）
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            backend/go.sum
            app/go.sum
            verification/go.sum
      - name: 先确认这台机器有窗口能力（权限不足与产品失败不是同一条答案）
        run: go -C verification run ./cmd/verify-graph doctor || echo "::warning::doctor 报环境不足，下面的 window lane journey 会因此失败"
      - name: 跑被点名的 journey
        run: |
          set -eu
          go -C verification run ./cmd/verify-graph verify \
            --journey F-02-nav \
            --journey F-03-conversations \
            --journey F-04-conversation \
            --journey F-05-composer \
            --journey F-06 \
            --journey F-07 \
            --journey F-08 \
            --journey F-10 \
            --journey F-11 \
            --journey F-12 \
            --journey F-13 \
            --journey F-14 \
            --journey F-16-empty-and-error \
            --journey shell-workspace \
            --journey ctl-board \
            --journey ctl-resources \
            --journey ctl-settings \
            --journey rail-assemblies \
            --journey rail-capabilities \
            --journey rail-fleet \
            --journey rail-providers \
            --journey rail-settings \
            --journey rail-trajectory \
            --journey controls-composer \
            --journey controls-fleet-filters \
            --journey controls-main-agent
      - name: 控件覆盖审计（每条 covered 都要有真跑过的证据）
        if: always()
        run: go -C verification run ./cmd/verify-graph cover audit
      - name: 保留证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ui
          path: |
            verification/evidence/**
            verification/controls/COVERAGE.generated.md
          if-no-files-found: ignore
      - name: 收尾（不留孤立守护进程）
        if: always()
        run: go -C verification run ./cmd/verify-graph cleanup --orphans || true
