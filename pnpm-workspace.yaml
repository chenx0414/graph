# Root package only; this file configures pnpm, not a multi-package layout.
saveExact: true
allowBuilds:
  '@google/genai': false
  electron-winstaller: false
  esbuild: true
  protobufjs: false
minimumReleaseAgeExclude:
  - '@types/node@24.13.4'
  - fastify@5.12.4
# The durable kernel is a release tuple, not a floating transitive SDK upgrade.
overrides:
  '@earendil-works/pi-durable>@earendil-works/pi-ai': 1.1.0
  '@earendil-works/pi-durable>@earendil-works/chord': 1.1.0
